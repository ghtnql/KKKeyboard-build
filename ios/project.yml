name: KKKeyboard
options:
  bundleIdPrefix: com.ghtnql.kkkeyboard
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Debug:
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
packages:
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.1.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.0.0
targets:
  KKKeyboardApp:
    type: application
    platform: iOS
    preBuildScripts:
      - name: Build SharedUI for App
        basedOnDependencyAnalysis: false
        script: |
          set -e
          cd "$SRCROOT/../android"
          ./gradlew :sharedUI:embedAndSignAppleFrameworkForXcode
    sources:
      - App
      - Learning
      - path: Shared/UserPhraseStore.swift
      - path: ../shared/phrases/default_phrases.json
        buildPhase: resources
      - path: Shared/KeyboardLayoutSettings.swift
      - path: Shared/KeyboardThemeSettings.swift
      - path: Shared/KeyboardThemeCatalog.swift
      - path: Shared/IOSKeyboardSettingsPlatform.swift
      - path: ../shared/content/learning_items.json
        buildPhase: resources
      - path: ../shared/themes/themes.json
        buildPhase: resources
      - path: ../shared/audio
        type: folder
        buildPhase: resources
    entitlements:
      path: App/KKKeyboardApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ghtnql.kkkeyboard
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ㅋㅋ키보드
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        KKRewardedAdUnitID: $(REWARDED_AD_UNIT_ID)
        KKInterstitialAdUnitID: $(INTERSTITIAL_AD_UNIT_ID)
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ghtnql.kkkeyboard
        REWARDED_AD_UNIT_ID: ""
        INTERSTITIAL_AD_UNIT_ID: ""
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../sharedUI/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework SharedUI"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
        Release:
          ADMOB_APP_ID: ""
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(IOS_APP_PROFILE_UUID)
    dependencies:
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - target: KKKeyboardExtension
        embed: true
  KKKeyboardExtension:
    type: app-extension
    platform: iOS
    preBuildScripts:
      - name: Build SharedUI for Keyboard Extension
        basedOnDependencyAnalysis: false
        script: |
          set -e
          cd "$SRCROOT/../android"
          ./gradlew :sharedUI:embedAndSignAppleFrameworkForXcode
    sources:
      - KeyboardExtension
      - Shared
      - path: ../shared/themes/themes.json
        buildPhase: resources
      - path: ../shared/phrases/default_phrases.json
        buildPhase: resources
      - path: ../shared/dictionaries/ja_common.json
        buildPhase: resources
      - path: ../shared/themes/seoul_day.jpg
        buildPhase: resources
      - path: ../shared/themes/seoul_day_portrait.jpg
        buildPhase: resources
      - path: ../shared/themes/seoul_night.jpg
        buildPhase: resources
      - path: ../shared/themes/seoul_night_portrait.jpg
        buildPhase: resources
    entitlements:
      path: KeyboardExtension/KKKeyboardExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ghtnql.kkkeyboard
    info:
      path: KeyboardExtension/Info.plist
      properties:
        CFBundleDisplayName: ㅋㅋ키보드
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: KKKeyboardExt
        CFBundlePackageType: XPC!
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: false
            PrimaryLanguage: ko-KR
            RequestsOpenAccess: false
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ghtnql.kkkeyboard.keyboard
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../sharedUI/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework SharedUI"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(IOS_EXTENSION_PROFILE_UUID)
  KKKeyboardTestHost:
    type: application
    platform: iOS
    sources:
      - TestHost
    info:
      path: TestHost/Info.plist
      properties:
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ghtnql.kkkeyboard.testhost
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  KKKeyboardTests:
    type: bundle.unit-test
    platform: iOS
    preBuildScripts:
      - name: Build SharedUI for Tests
        basedOnDependencyAnalysis: false
        script: |
          set -e
          cd "$SRCROOT/../android"
          ./gradlew :sharedUI:embedAndSignAppleFrameworkForXcode
    sources:
      - Tests
      - Shared
      - path: ../shared/themes/themes.json
        buildPhase: resources
      - path: ../shared/phrases/default_phrases.json
        buildPhase: resources
      - Learning
      - path: KeyboardExtension/LongPressKeyButton.swift
      - path: KeyboardExtension/SharedFlickKeyControl.swift
      - path: KeyboardExtension/KeyboardViewController.swift
      - path: App/AppUILanguage.swift
      - path: App/AppPresentationContext.swift
      - path: ../shared/dictionaries/ja_common.json
        buildPhase: resources
      - path: ../shared/test-fixtures/ja_predictions.json
        buildPhase: resources
      - path: ../shared/content/learning_items.json
        buildPhase: resources
    dependencies:
      - target: KKKeyboardTestHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ghtnql.kkkeyboard.tests
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../sharedUI/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework SharedUI"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/KKKeyboardTestHost.app/KKKeyboardTestHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
  KKKeyboardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: KKKeyboardApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ghtnql.kkkeyboard.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  KKKeyboardPhraseTests:
    build:
      targets:
        KKKeyboardTestHost: all
        KKKeyboardTests: [test]
    test:
      gatherCoverageData: false
      targets:
        - KKKeyboardTests
  KKKeyboard:
    build:
      targets:
        KKKeyboardApp: all
        KKKeyboardExtension: all
        KKKeyboardTests: [test]
        KKKeyboardUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - KKKeyboardTests
        - KKKeyboardUITests
