name: iOS App Store screenshots

# Store assets only: no tests, archive, signing, or TestFlight upload.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Full source commit SHA matching the App Store build'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-store-screenshots-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Validate immutable source reference
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha must be a full lowercase commit SHA' >&2; exit 1; }

      - name: Checkout capture tooling
        uses: actions/checkout@v4
        with:
          path: capture-tooling

      - name: Checkout exact app source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: app-source

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK for KMP configuration
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Install XcodeGen 2.46.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen.zip"
          curl -fsSL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$archive"
          echo '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  '"$archive" | shasum -a 256 -c -
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Capture actual app home on required devices
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          bash capture-tooling/tools/capture-ios-store-screenshots.sh \
            "$GITHUB_WORKSPACE/app-source" "$RUNNER_TEMP/ios-store-screenshots"

      - name: Upload screenshots and capture provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-store-screenshots-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/ios-store-screenshots
          if-no-files-found: error
          retention-days: 14
