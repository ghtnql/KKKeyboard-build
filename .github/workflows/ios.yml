name: iOS CI

on:
  workflow_dispatch:
    inputs:
      apk_test_complete:
        description: 'I finished testing the APK for this exact commit'
        required: true
        type: boolean
        default: false
      tested_commit:
        description: 'Full 40-character SHA of the tested APK commit (must equal this workflow commit)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ inputs.apk_test_complete == true && inputs.tested_commit == github.sha }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK for KMP Gradle configuration
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Install XcodeGen 2.46.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen.zip"
          curl -fsSL \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            -o "$archive"
          echo '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  '"$archive" | shasum -a 256 -c -
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build app and keyboard extension
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project KKKeyboard.xcodeproj \
            -scheme KKKeyboard \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify unsigned device archive
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project KKKeyboard.xcodeproj \
            -scheme KKKeyboard \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/KKKeyboard-unsigned.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive
          test -d "$RUNNER_TEMP/KKKeyboard-unsigned.xcarchive/Products/Applications/KKKeyboardApp.app/PlugIns/KKKeyboardExtension.appex"
          extension_plist="$RUNNER_TEMP/KKKeyboard-unsigned.xcarchive/Products/Applications/KKKeyboardApp.app/PlugIns/KKKeyboardExtension.appex/Info.plist"
          test "$(plutil -extract NSExtension.NSExtensionAttributes.RequestsOpenAccess raw "$extension_plist")" = false

      - name: Select test destination
        id: test-destination
        working-directory: ios
        run: |
          set -euo pipefail

          simulator_udid="$({
            xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime_devices in data.get("devices", {}).values():
              for device in runtime_devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit
          '
          } || true)"

          if [[ -n "$simulator_udid" ]]; then
            destination="id=$simulator_udid"
            echo "Using available iPhone simulator: $destination"
          else
            mac_destination_id="$({
              xcodebuild \
                -project KKKeyboard.xcodeproj \
                -scheme KKKeyboard \
                -showdestinations 2>/dev/null \
                | sed -n 's/.*platform:macOS.*id:\([^,}]*\).*/\1/p' \
                | head -n 1 \
                | xargs
            } || true)"

            if [[ -z "$mac_destination_id" ]]; then
              echo "No runnable iPhone simulator or Designed-for-iPhone/iPad Mac destination is available." >&2
              xcodebuild -project KKKeyboard.xcodeproj -scheme KKKeyboard -showdestinations >&2
              exit 1
            fi

            destination="id=$mac_destination_id"
            echo "No iPhone simulator is installed; using Xcode-provided Mac destination: $destination"
          fi

          echo "destination=$destination" >> "$GITHUB_OUTPUT"

      - name: Run unit and UI tests
        working-directory: ios
        run: |
          set -o pipefail
          rm -rf TestResults.xcresult
          xcodebuild \
            -project KKKeyboard.xcodeproj \
            -scheme KKKeyboard \
            -configuration Debug \
            -destination '${{ steps.test-destination.outputs.destination }}' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee xcodebuild-test.log

      - name: Run shared Kotlin iOS simulator tests
        working-directory: android
        run: ./gradlew -Pkotlin.incremental=false --max-workers=1 :sharedCore:iosSimulatorArm64Test :sharedUI:iosSimulatorArm64Test

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-diagnostics
          path: |
            ios/xcodebuild-test.log
            ios/TestResults.xcresult
          if-no-files-found: warn
          retention-days: 7
